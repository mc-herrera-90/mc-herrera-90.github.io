<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Demo Reveal.js con cambio de tema</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS base de Reveal -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js/dist/reveal.css">

    <!-- Tema inicial -->
    <link id="theme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js/dist/theme/blood.css">

    <!--  Bootstrap Grid -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap-grid.min.css" integrity="sha512-dOjUSaLkr6G2pwQ7ry9juX+iXw5602zg1kg8yH+guR3uSEidGyCnOEQnGlr7xwu/8WE+pVm1ZNqaIs5ETTIJQg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
      .theme-switcher {
        position: fixed;
        top: 15px;
        right: 15px;
        background: rgba(0,0,0,0.6);
        padding: 10px 15px;
        border-radius: 8px;
        z-index: 1000;
      }

      .theme-switcher button {
        margin: 3px;
        padding: 6px 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        background-color: #fff;
        color: #333;
        font-size: 13px;
        font-weight: 600;
      }

      .theme-switcher button:hover {
        background-color: #ddd;
      }

    .bg-pattern {
    background-image:
        radial-gradient(circle, rgba(255,255,255,0.02) 2px, transparent 2px),
        repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 1px, transparent 1px, transparent 15px),
        repeating-linear-gradient(-45deg, rgba(255,255,255,0.01) 1px, transparent 1px, transparent 15px);
    background-size: 20px 20px, 20px 20px, 20px 20px;
    }
    </style>
  </head>
  <body>

    <!-- Panel para cambiar de tema -->
    <div class="theme-switcher">
      <button onclick="changeTheme('beige')">Beige</button>
      <button onclick="changeTheme('dracula')">Dracula</button>
      <button onclick="changeTheme('white')">White</button>
      <button onclick="changeTheme('league')">League</button>
      <button onclick="changeTheme('night')">Night</button>
      <button onclick="changeTheme('serif')">Serif</button>
      <button onclick="changeTheme('simple')">Simple</button>
      <button onclick="changeTheme('solarized')">Solarized</button>
    </div>

    <div class="reveal">
      <div class="slides">
        <section class="bg-pattern">
<div style="display: flex; justify-content: center; gap: 50px">
  <span class="fragment fade-right" data-fragment-index="2">Full Stack Developer</span>
  .
  <span class="fragment fade-left" data-fragment-index="5">Padre Orgulloso</span>
</div>

<img src="https://hackmd.io/_uploads/rkOoQmDulg.jpg" width="250" style="border-radius: 50%; border: 8px solid #ccc;" class="fragment zoom-in" data-fragment-index="7" alt="perfil-img"/>

<div style="display: flex; justify-content: center; gap: 50px">
  <span class="fragment fade-right" data-fragment-index="4">Arquitecto Cloud</span>
    .
  <span class="fragment fade-left" data-fragment-index="3">Retrogeek de corazón</span>
</div>
        </section>
      </div>
    </div>

    <!-- JS de Reveal -->
    <script src="https://cdn.jsdelivr.net/npm/reveal.js/dist/reveal.js"></script>

    <script>
      // Inicializa Reveal
      Reveal.initialize();

      // Función para cambiar el tema dinámicamente
      function changeTheme(themeName) {
        const themeLink = document.getElementById('theme');
        themeLink.href = `https://cdn.jsdelivr.net/npm/reveal.js/dist/theme/${themeName}.css`;
      }
    </script>

  </body>
</html>
