<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Demo Reveal.js con cambio de tema</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS base de Reveal -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js/dist/reveal.css">

    <!-- Tema inicial -->
    <link id="theme" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js/dist/theme/beige.css">

    <style>
      .theme-switcher {
        position: fixed;
        top: 15px;
        right: 15px;
        background: rgba(0,0,0,0.6);
        padding: 10px 15px;
        border-radius: 8px;
        z-index: 1000;
      }

      .theme-switcher button {
        margin: 3px;
        padding: 6px 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        background-color: #fff;
        color: #333;
        font-size: 13px;
        font-weight: 600;
      }

      .theme-switcher button:hover {
        background-color: #ddd;
      }
    </style>
  </head>
  <body>

    <!-- Panel para cambiar de tema -->
    <div class="theme-switcher">
      <button onclick="changeTheme('beige')">Beige</button>
      <button onclick="changeTheme('black')">Black</button>
      <button onclick="changeTheme('dracula')">Dracula</button>
      <button onclick="changeTheme('white')">White</button>
      <button onclick="changeTheme('league')">League</button>
      <button onclick="changeTheme('moon')">Moon</button>
      <button onclick="changeTheme('night')">Night</button>
      <button onclick="changeTheme('serif')">Serif</button>
      <button onclick="changeTheme('simple')">Simple</button>
      <button onclick="changeTheme('sky')">Sky</button>
      <button onclick="changeTheme('solarized')">Solarized</button>
    </div>

    <div class="reveal">
      <div class="slides">
        <section>
          <h2>🎉 Presentación con Reveal.js</h2>
          <p>Con cambio de tema dinámico.</p>
          <a href="#">Link de ejemplo</a>
        </section>
      </div>
    </div>

    <!-- JS de Reveal -->
    <script src="https://cdn.jsdelivr.net/npm/reveal.js/dist/reveal.js"></script>

    <script>
      // Inicializa Reveal
      Reveal.initialize();

      // Función para cambiar el tema dinámicamente
      function changeTheme(themeName) {
        const themeLink = document.getElementById('theme');
        themeLink.href = `https://cdn.jsdelivr.net/npm/reveal.js/dist/theme/${themeName}.css`;
      }
    </script>

  </body>
</html>
