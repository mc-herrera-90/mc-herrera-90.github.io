---
layout: page
---

<article class="course">
  <header>
    <h1>{{ page.title }}</h1>
    <p class="meta">
      <strong>Categoría:</strong> {{ page.category }} |
      <strong>Duración:</strong> {{ page.duration }} |
      <strong>Nivel:</strong> {{ page.level }}
    </p>
    <p>{{ page.description }}</p>
  </header>

  <div class="content">
    {{ content }}
  </div>
</article>
