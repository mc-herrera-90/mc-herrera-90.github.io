<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.0/reveal.min.css">
  <link id="reveal-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.0/theme/{{ page.theme | default: 'black'}}.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.1/css/all.min.css">
  <link rel="stylesheet" href="{{ 'assets/plugins/copycode.css' | relative_url }}">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .reveal p, .reveal p code, .reveal ul, .reveal ol {
      font-size: .75em;
    }

    .reveal blockquote {
      width: 100%;
      margin: 1.5rem 0;
      padding: 1rem 1.25rem;

      background: #1e1e1e;
      border-left: 4px solid #4f8cff;

      color: #dcdcdc;
      font-size: 0.9em;
      line-height: 1.6;

      border-radius: 6px;
      box-shadow: none;
    }

    .reveal blockquote p {
      margin: 0;
    }

    .reveal blockquote::before {
      content: "Nota";
      display: block;

      margin-bottom: 0.5rem;

      color: #4f8cff;
      font-size: 0.75em;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    kbd {
      display: inline-block;
      padding: 2px 10px;
      font-family: monospace;
      color: #222;
      background: linear-gradient(#f9f9f9, #dcdcdc);
      border: 1px solid #aaa;
      border-radius: 5px;
      box-shadow:
        0 2px 0 #aaa,
        0 3px 4px rgba(0,0,0,0.2);
    }

    kbd:active {
      transform: translateY(2px);
      box-shadow:
        0 1px 0 #aaa,
        0 2px 3px rgba(0,0,0,0.2);
    }
    .codeblock {
      --cc-code-bg: #fafafa;
      color: #222;
      box-shadow: 1px 1px 2px 1px #dfdfdf;
      border-radius: 8px;
      padding: 0 !important;
      overflow: clip;
    }

    .codeblock pre {
      white-space: normal;
      background-color: #fff;
      width: 100%;
      padding-left: 5px;
    }

    .cc-window-bar {
      padding-bottom: 0 !important;
      border-bottom: 1px solid #d0d0d0;
      margin: 4px;
      color: #222;
      width: 100%;
      --cc-window-title-color: #222;
    }
    code.bash {
      white-space: pre;
    }
  </style>
</head>
<body>

<div class="reveal">
  <div class="slides">
    {{ content }}
  </div>
</div>

<!-- Reveal.js desde CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.0/plugin/markdown/markdown.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.0/reveal.min.js"></script>
<script src="{{ 'assets/plugins/copycode.js' | relative_url }}"></script>

<script>
  const themeLink = document.getElementById("reveal-theme");

  function setTheme() {
    const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

    const theme = isDark ? "black" : "white";

    themeLink.href =
      `https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/theme/${theme}.min.css`;
  }
  window.addEventListener("load", setTheme);
  window.matchMedia("(prefers-color-scheme: dark)")
    .addEventListener("change", setTheme);

  Reveal.initialize({
    hash: true,
    slideNumber: true,
    copycode: {
      display: "icons",
      text: {
        copy: "Copiar",
        copied: "¡Copiado!"
      },
      window: {
        title: "Terminal"
      },
      style: {
        copybg: "transparent",
        radius: "0.4em"
      }
    },
    plugins: [RevealMarkdown, CopyCode]

  });

</script>

</body>
</html>
