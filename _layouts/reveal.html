<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>

  <link rel="stylesheet" href="{{ '/assets/css/libs/reveal.js/reveal.min.css' | relative_url }}">
  <link id="highlight-theme" rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
  <link id="reveal-theme" rel="stylesheet"
    href="/assets/css/libs/reveal.js/theme/{{ page.theme | default: 'black'}}.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.1/css/all.min.css">
  <link rel="stylesheet" href="{{ 'assets/css/libs/reveal.js/base.css' | relative_url }}">
  <link rel="stylesheet" href="{{ 'assets/plugins/copycode.css' | relative_url }}">
  <link rel="stylesheet" href="{{ 'assets/css/libs/reveal.js/custom.css' | relative_url }}">
  <link rel="stylesheet" href="{{ 'assets/css/libs/reveal.js/syntax.css' | relative_url }}">
  <style>
    kbd {
      display: inline-block;
      padding: 0 5px;
      font-family: monospace;
      color: #222;
      background: linear-gradient(#f9f9f9, #dcdcdc);
      border: 1px solid #aaa;
      border-radius: 5px;
    }

    kbd:active {
      transform: translateY(2px);
      box-shadow: 0 1px 0 #aaa, 0 2px 3px rgba(0, 0, 0, 0.2);
    }


    .cc-window-bar {
      padding-bottom: 0 !important;
      margin: 4px;
      color: #222;
      width: 100%;
    }

    .white * {
      color: white !important;
    }


    /* icono limpio */


    video {
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, .1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .05);
      overflow: hidden;
    }

    @media(hover: hover) {
      .h-gray-to-color {
        filter: grayscale(100%) opacity(0.75);
        transition: filter 0.3s ease;
      }

      .h-gray-to-color:hover {
        filter: grayscale(0%) opacity(1);
      }
    }
  </style>
</head>

<body>

  <div class="reveal">
    <div class="slides">
      <section data-markdown data-separator-vertical="^\n--\n$">
        <textarea data-template>
            {{ content }}
          </textarea>
      </section>
    </div>
  </div>

  <!-- Reveal.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.0/reveal.min.js"></script>
  <!-- Plugins -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.0/plugin/markdown/markdown.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.0/plugin/highlight/highlight.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.0/plugin/math/math.js"></script>
  <script src="{{ 'assets/plugins/copycode.js' | relative_url }}"></script>
  <script src="{{ 'assets/js/trivia.js' | relative_url }}"></script>

  <script>
    const themeLink = document.getElementById("reveal-theme");
    const highlightTheme = document.getElementById("highlight-theme");

    function setTheme() {
      const systemIsDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

      // prioridad: front matter (page.theme)
      const pageTheme = "{{ page.theme | default: '' }}";

      let theme;

      if (pageTheme === "black" || pageTheme === "white") {
        theme = pageTheme;
      } else {
        theme = systemIsDark ? "black" : "white"; // fallback sistema
      }

      themeLink.href = `/assets/css/libs/reveal.js/theme/${theme}.css`;

      highlightTheme.href =
        theme === "black"
          ? "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css"
          : "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css";

      document.querySelectorAll("section[data-bg-light]").forEach(slide => {
        slide.setAttribute(
          "data-background-image",
          theme === "black" ? slide.dataset.bgDark : slide.dataset.bgLight
        );
      });
    }

    window.addEventListener("load", setTheme);
    window.matchMedia("(prefers-color-scheme: dark)")
      .addEventListener("change", setTheme);

    Reveal.initialize({
      hash: true,
      slideNumber: true,
      embedded: false,
      copycode: {
        display: "icons",
        text: {
          copy: "Copiar",
          copied: "¡Copiado!"
        },
        window: {
          title: "Terminal"
        },
        style: {
          copybg: "transparent",
          radius: "0.4em"
        }
      },
      plugins: [RevealMarkdown, CopyCode, RevealHighlight, RevealMath.KaTeX],
    });

    Reveal.on('ready', async () => {

      document.querySelectorAll(".codeblock").forEach(block => {

        const code = block.querySelector("code");
        const title = block.querySelector(".cc-window-title");

        if (!code || !title) return;

        const languageClass = [...code.classList][0];

        if (!languageClass) return;

        const language = languageClass
          .replace("language-", "")
          .replace(/^js$/, "JavaScript")
          .replace(/^html$/, "HTML")
          .replace(/^css$/, "CSS")
          .replace(/^bash$/, "Terminal")
          .replace(/^shell$/, "Shell");

        title.textContent = language
      })
    })

    Reveal.on('ready', () => {
      document.querySelectorAll('.codeblock').forEach(codeBlock => {

        const pre = codeBlock.querySelector('code');


        // Solo agregar botón a bloques ejecutables
        if (!pre?.classList.contains('run')) return;

        const toolbar = codeBlock.querySelector('.cc-window-right');
        if (!toolbar) return;

        const runBtn = document.createElement('button');
        runBtn.className = 'cc-run-btn';
        runBtn.innerHTML = '<i class="fa fa-play-circle"></i>';
        runBtn.title = 'Ejecutar código';

        const slide = codeBlock.closest('section');
        const previewId = slide?.dataset.preview;
        const lang = slide?.dataset.lang || 'javascript';
        if (!previewId) return;
        const url = `https://onecompiler.com/embed/${lang}/${previewId}?fontSize=15&hideEditorOptions=false&theme=dark&hideStdin=true&hideResult=false`;
        runBtn.addEventListener('click', () => {
          const a = document.createElement('a');
          a.href = url;
          a.setAttribute('data-preview-link', '');
          a.style.display = 'none';
          slide.appendChild(a);
          a.click();
          a.remove();
        });

        toolbar.insertBefore(runBtn, toolbar.firstChild);
      });
    });
  </script>

</body>

</html>
