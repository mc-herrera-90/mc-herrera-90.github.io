<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.0/reveal.min.css">
  <link id="reveal-theme" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.0/theme/{{ page.theme | default: 'black'}}.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.1/css/all.min.css">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    kbd {
      display: inline-block;
      padding: 6px 10px;
      font-family: monospace;
      color: #222;
      background: linear-gradient(#f9f9f9, #dcdcdc);
      border: 1px solid #aaa;
      border-radius: 5px;
      box-shadow:
        0 2px 0 #aaa,
        0 3px 4px rgba(0,0,0,0.2);
    }

    kbd:active {
      transform: translateY(2px);
      box-shadow:
        0 1px 0 #aaa,
        0 2px 3px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

<div class="reveal">
  <div class="slides">
    {{ content }}
  </div>
</div>

<!-- Reveal.js desde CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.0/plugin/markdown/markdown.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.2.0/reveal.min.js"></script>
<script>
  const themeLink = document.getElementById("reveal-theme");

  function setTheme() {
    const isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;

    const theme = isDark ? "black" : "white";

    themeLink.href =
      `https://cdnjs.cloudflare.com/ajax/libs/reveal.js/5.1.0/theme/${theme}.min.css`;
  }
  window.addEventListener("load", setTheme);
  window.matchMedia("(prefers-color-scheme: dark)")
    .addEventListener("change", setTheme);

  Reveal.initialize({
    hash: true,
    slideNumber: true,
    plugins: [RevealMarkdown]
  });
</script>

</body>
</html>
