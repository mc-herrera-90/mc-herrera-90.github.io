<div class="iframe-demo">

<iframe
  style="width:100%;height:10px; border-radius:8px;"
  sandbox="allow-scripts allow-same-origin"
  loading="lazy"
></iframe>

<template class="iframe-content">{{ include.content | rstrip }}</template>

<script>
(function () {

  const wrapper = document.currentScript.parentElement;
  const iframe = wrapper.querySelector("iframe");
  const tpl = wrapper.querySelector(".iframe-content");

  const html = tpl.innerHTML.trim();

  iframe.srcdoc = `
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
  margin:0;
  padding:16px;
}
</style>

</head>
<body>

${html}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"><\/script>
</body>
</html>
`;

  iframe.addEventListener("load", function () {

    const doc = iframe.contentDocument || iframe.contentWindow.document;

    const resize = () => {
      const height = doc.documentElement.scrollHeight;
      iframe.style.height = height + "px";
    };

    resize();

    // si el contenido cambia (Bootstrap, imágenes, etc.)
    const observer = new ResizeObserver(resize);
    observer.observe(doc.body);

  });

})();
</script>

</div>
