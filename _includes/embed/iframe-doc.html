<div class="iframe-demo">
  <iframe
    style="width:100%; height:400px; border:1px solid #555; border-radius:8px;"
    sandbox="allow-scripts allow-same-origin"
  ></iframe>

  <template class="iframe-content" type="text/plain">
{{ include.content }}
  </template>

  <script>
    (function () {
      const wrapper = document.currentScript.parentElement;
      const iframe = wrapper.querySelector("iframe");
      const tpl = wrapper.querySelector(".iframe-content");

      const doc = iframe.contentDocument || iframe.contentWindow.document;

      doc.open();
      doc.write(`
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-3">
${tpl.textContent}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
      `);
      doc.close();
    })();
  </script>
</div>
