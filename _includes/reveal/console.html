<style>
 .console-wrapper{
  position: relative;
}

/* botón estilo inline tipo @ */
.console-restart{
  position: absolute;
  top: 10px;
  right: 40px;

  display: inline-flex;
  align-items: center;
  gap: 6px;

  padding: 6px 10px;
  font-size: 12px;

  background: rgba(255,255,255,0.08);
  color: #eaeaea;

  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 999px;

  cursor: pointer;

  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);

  transition: all 0.2s ease;
}

.console-restart:hover{
  background: rgba(255,255,255,0.15);
  transform: translateY(-1px);
}

.console-restart:active{
  transform: translateY(0px) scale(0.96);
}
</style>
<div class="console-wrapper">
<iframe
  class="console-frame"
  id="console-{{ include.id }}"
  src="https://mcherrera911.oneapp.dev/"
  style="width:100%;height:320px;border:0;border-radius:8px;">
</iframe>
<button class="console-restart" type="button">
  🔄 Reiniciar
</button>
<script type="text/plain" class="console-code">
{{ include.code | strip_html | strip_newlines }}
</script>
</div>
