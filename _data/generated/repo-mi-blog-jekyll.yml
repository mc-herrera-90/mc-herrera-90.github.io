  - name: "mi-blog-jekyll/.gitignore"
    language: ".gitignore"
    content_file: |
      ### Jekyll ###
      _site/
      .sass-cache/
      .jekyll-cache/
      .jekyll-metadata
      # Ignore folders generated by Bundler
      .bundle/
      vendor/
  - name: "mi-blog-jekyll/index.html"
    language: "html"
    content_file: |
      ---
      layout: default
      title: Blog
      ---

      <ul>
        {% for post in paginator.posts %}
          <li class="post-item">
            <a href="{{ post.url | relative_url }}">
              {{ post.title }}
            </a>
            <small>— {{ post.date | date: "%d-%m-%Y" }}</small>
            <p>{{ post.excerpt }}</p>
          </li>
        {% endfor %}
      </ul>

      <nav class="pagination">
        {% if paginator.previous_page %}
          <a href="{{ paginator.previous_page_path }}">
            ← Más recientes
          </a>
        {% endif %}

        {% if paginator.next_page %}
          <a href="{{ paginator.next_page_path }}">
            Más antiguos →
          </a>
        {% endif %}
      </nav>
