- name: mi-blog/src/pages/index.astro
  language: jsx
  content_file: |
    ---
    import BaseHead from '../components/BaseHead.astro';
    import Footer from '../components/Footer.astro';
    import Header from '../components/Header.astro';
    import { SITE_DESCRIPTION, SITE_TITLE } from '../consts';
    ---

    <!doctype html>
    <html lang="en">
      <head>
        <BaseHead title={SITE_TITLE} description={SITE_DESCRIPTION} />
      </head>
      <body>
        <Header />
        <main>
          <h1>🧑‍🚀 Hello, Astronaut!</h1>
          <p>
            Welcome to the official <a href="https://astro.build/">Astro</a> blog starter template. This template
            serves as a lightweight, minimally-styled starting point for anyone looking to build a personal
            website, blog, or portfolio with Astro.
          </p>
          <p>
            This template comes with a few integrations already configured in your
            <code>astro.config.mjs</code> file. You can customize your setup with
            <a href="https://astro.build/integrations">Astro Integrations</a> to add tools like Tailwind,
            React, or Vue to your project.
          </p>
          <p>Here are a few ideas on how to get started with the template:</p>
          <ul>
            <li>Edit this page in <code>src/pages/index.astro</code></li>
            <li>Edit the site header items in <code>src/components/Header.astro</code></li>
            <li>Add your name to the footer in <code>src/components/Footer.astro</code></li>
            <li>Check out the included blog posts in <code>src/content/blog/</code></li>
            <li>Customize the blog post page layout in <code>src/layouts/BlogPost.astro</code></li>
          </ul>
          <p>
            Have fun! If you get stuck, remember to
            <a href="https://docs.astro.build/">read the docs</a>
            or <a href="https://astro.build/chat">join us on Discord</a> to ask questions.
          </p>
          <p>
            Looking for a blog template with a bit more personality? Check out
            <a href="https://github.com/Charca/astro-blog-template">astro-blog-template</a>
            by <a href="https://twitter.com/Charca">Maxi Ferreira</a>.
          </p>
        </main>
        <Footer />
      </body>
    </html>

- name: mi-blog/src/pages/rss.xml.js
  language: js
  content_file: |
    import { getCollection } from 'astro:content';
    import rss from '@astrojs/rss';
    import { SITE_DESCRIPTION, SITE_TITLE } from '../consts';

    export async function GET(context) {
      const posts = await getCollection('blog');
      return rss({
        title: SITE_TITLE,
        description: SITE_DESCRIPTION,
        site: context.site,
        items: posts.map((post) => ({
          ...post.data,
          link: `/blog/${post.id}/`,
        })),
      });
    }

- name: mi-blog/src/styles/global.css
  language: css
  content_file: |
    /*
      The CSS in this style tag is based off of Bear Blog's default CSS.
      https://github.com/HermanMartinus/bearblog/blob/297026a877bc2ab2b3bdfbd6b9f7961c350917dd/templates/styles/blog/default.css
      License MIT: https://github.com/HermanMartinus/bearblog/blob/master/LICENSE.md
    */

    :root {
      --accent: #2337ff;
      --accent-dark: #000d8a;
      --black: 15, 18, 25;
      --gray: 96, 115, 159;
      --gray-light: 229, 233, 240;
      --gray-dark: 34, 41, 57;
      --gray-gradient: rgba(var(--gray-light), 50%), #fff;
      --box-shadow:
        0 2px 6px rgba(var(--gray), 25%), 0 8px 24px rgba(var(--gray), 33%), 0 16px 32px
        rgba(var(--gray), 33%);
    }
    @font-face {
      font-family: "Atkinson";
      src: url("/fonts/atkinson-regular.woff") format("woff");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: "Atkinson";
      src: url("/fonts/atkinson-bold.woff") format("woff");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    body {
      font-family: "Atkinson", sans-serif;
      margin: 0;
      padding: 0;
      text-align: left;
      background: linear-gradient(var(--gray-gradient)) no-repeat;
      background-size: 100% 600px;
      word-wrap: break-word;
      overflow-wrap: break-word;
      color: rgb(var(--gray-dark));
      font-size: 20px;
      line-height: 1.7;
    }
    main {
      width: 720px;
      max-width: calc(100% - 2em);
      margin: auto;
      padding: 3em 1em;
    }
    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      margin: 0 0 0.5rem 0;
      color: rgb(var(--black));
      line-height: 1.2;
    }
    h1 {
      font-size: 3.052em;
    }
    h2 {
      font-size: 2.441em;
    }
    h3 {
      font-size: 1.953em;
    }
    h4 {
      font-size: 1.563em;
    }
    h5 {
      font-size: 1.25em;
    }
    strong,
    b {
      font-weight: 700;
    }
    a {
      color: var(--accent);
    }
    a:hover {
      color: var(--accent);
    }
    p {
      margin-bottom: 1em;
    }
    .prose p {
      margin-bottom: 2em;
    }
    textarea {
      width: 100%;
      font-size: 16px;
    }
    input {
      font-size: 16px;
    }
    table {
      width: 100%;
    }
    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    code {
      padding: 2px 5px;
      background-color: rgb(var(--gray-light));
      border-radius: 2px;
    }
    pre {
      padding: 1.5em;
      border-radius: 8px;
    }
    pre > code {
      all: unset;
    }
    blockquote {
      border-left: 4px solid var(--accent);
      padding: 0 0 0 20px;
      margin: 0;
      font-size: 1.333em;
    }
    hr {
      border: none;
      border-top: 1px solid rgb(var(--gray-light));
    }
    @media (max-width: 720px) {
      body {
        font-size: 18px;
      }
      main {
        padding: 1em;
      }
    }

    .sr-only {
      border: 0;
      padding: 0;
      margin: 0;
      position: absolute !important;
      height: 1px;
      width: 1px;
      overflow: hidden;
      /* IE6, IE7 - a 0 height clip, off to the bottom right of the visible 1px box */
      clip: rect(1px 1px 1px 1px);
      /* maybe deprecated but we need to support legacy browsers */
      clip: rect(1px, 1px, 1px, 1px);
      /* modern browsers, clip-path works inwards from each corner */
      clip-path: inset(50%);
      /* added line to stop words getting smushed together (as they go onto separate lines and some screen readers do not understand line feeds as a space */
      white-space: nowrap;
    }

- name: mi-blog/src/consts.ts
  language: ts
  content_file: |
    // Place any global data in this file.
    // You can import this data from anywhere in your site by using the `import` keyword.

    export const SITE_TITLE = 'Astro Blog';
    export const SITE_DESCRIPTION = 'Welcome to my website!';

- name: mi-blog/src/content.config.ts
  language: ts
  content_file: |
    import { defineCollection, z } from 'astro:content';
    import { glob } from 'astro/loaders';

    const blog = defineCollection({
      // Load Markdown and MDX files in the `src/content/blog/` directory.
      loader: glob({ base: './src/content/blog', pattern: '**/*.{md,mdx}' }),
      // Type-check frontmatter using a schema
      schema: ({ image }) =>
        z.object({
          title: z.string(),
          description: z.string(),
          // Transform string to Date object
          pubDate: z.coerce.date(),
          updatedDate: z.coerce.date().optional(),
          heroImage: image().optional(),
        }),
    });

    export const collections = { blog };

- name: mi-blog/astro.config.mjs
  language: ts
  content_file: |
    // @ts-check

    import mdx from '@astrojs/mdx';
    import sitemap from '@astrojs/sitemap';
    import { defineConfig } from 'astro/config';

    import react from '@astrojs/react';

    // https://astro.build/config
    export default defineConfig({
        site: 'https://example.com',
        integrations: [mdx(), sitemap(), react()],
    });

