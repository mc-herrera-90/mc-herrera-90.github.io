- name: blog/src/components/FormattedDate.astro
  language: "js"
  content_file: |
    ---
    interface Props {
      date: Date;
    }

    const { date } = Astro.props;
    ---

    <time datetime={date.toISOString()}>
      {
        date.toLocaleDateString('en-us', {
          year: 'numeric',
          month: 'short',
          day: 'numeric',
        })
      }
    </time>
