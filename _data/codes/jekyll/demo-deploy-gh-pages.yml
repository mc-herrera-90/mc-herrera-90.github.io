- name: '_layouts/default.html'
  language: html
  content_file: |
    <!DOCTYPE html>
    <html lang="es">
      <head>
        <meta charset="UTF-8" />
        <title>
          {% if page.title %}
            {{ page.title }} | {{ site.title }}
          {% else %}
            {{ site.title }}
          {% endif %}
        </title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="{{ page.excerpt | strip_html | truncate: 160 }}">
        <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
      </head>

      <body>
        <header>
          <h1>
            <a href="{{ '/' | relative_url }}">
              {{ site.title }}
            </a>
          </h1>
          <p>{{ site.description }}</p>
          <hr>
        </header>

        <main>
          {{ content }}
        </main>

        <footer>
          <hr>
          <p>
            © {{ "now" | date: "%Y" }} {{ site.title }} —
            Publicado con Jekyll y GitHub Pages
          </p>
        </footer>
      </body>
    </html>

- name: 'assets/css/style.css'
  language: css
  content_file: |
    /* ===== Reset mínimo ===== */
    html, body {
      height: 100%;
      margin: 0;
    }

    /* ===== Base ===== */
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      line-height: 1.65;
      color: #1f2937;
      background: #f3f4f6;
    }

    /* ===== Layout vertical ===== */
    .page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }

    header,
    main,
    footer {
      max-width: 900px;
      margin: 0 auto;
      padding: 2.5rem 2rem;
    }

    main {
      flex: 1;
      background: #ffffff;
    }

    /* ===== Header ===== */
    header h1 {
      margin: 0;
      font-size: 2rem;
    }

    header p {
      margin-top: 0.5rem;
      max-width: 60ch;
      color: #6b7280;
    }

    header a {
      color: inherit;
      text-decoration: none;
    }

    /* ===== Typography ===== */
    h1, h2, h3 {
      line-height: 1.3;
      margin-top: 3rem;
    }

    h2 {
      font-size: 1.5rem;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 0.4rem;
    }

    p {
      margin: 1.2rem 0;
      max-width: 72ch;
    }

    /* ===== Links ===== */
    a {
      color: #2563eb;
    }

    a:hover {
      text-decoration: underline;
    }

    /* ===== Code ===== */
    pre {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      padding: 1.25rem 1.5rem;
      overflow-x: auto;
    }

    code {
      background: #eef2ff;
      padding: 0.2em 0.4em;
      font-size: 0.95em;
    }

    pre code {
      background: none;
      padding: 0;
    }

    /* ===== Footer ===== */
    footer {
      text-align: center;
      font-size: 0.9rem;
      color: #6b7280;
    }

    /* ===== Responsive ===== */
    @media (max-width: 640px) {
      header,
      main,
      footer {
        padding: 1.5rem 1.2rem;
      }
    }

- name: '_config.yml'
  language: yml
  show: true
  content_file: |
    title: 'Jekyll + GitHub Page'
    description: 'Despliegue simple de un sitio Jekyll en GitHub Pages, sin usar GitHub Actions'
    base_url: '/demo-jekyll-deploy-gh-pages'

- name: '.gitignore'
  language: bash
  content_file: |
    _site/
    .sass-cache/
    .jekyll-cache/
    .jekyll-metadata
    .bundle/
    vendor/
    Gemfile.lock


- name: 'index.md'
  language: md
  content_file: |
    ---
    layout: default
    title: Inicio
    ---

    ## Hola Jekyll ❤️
    Mi sitio está funcionando.
