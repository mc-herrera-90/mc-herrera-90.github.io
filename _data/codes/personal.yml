      - **Portfolio interactivo:** React + Tailwind, mostrando mis habilidades y proyectos.
      - **Sistema bancario simulado:** Python, manejo de validaciones y operaciones.
      - **Dashboard en la nube:** AWS + Node.js, integración de APIs y monitoreo.
      - Cada proyecto refleja eficiencia, aprendizaje y creatividad.

