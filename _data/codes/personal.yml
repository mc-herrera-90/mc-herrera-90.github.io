  - name: "onlyflans.md"
    language: "md"
    content_file: |
      # OnlyFlans

      Aplicación web desarrollada con Django para la gestión y visualización
      de productos, enfocada en una experiencia simple y clara para el usuario.

      ## Contexto

      OnlyFlans nace como un proyecto práctico para aplicar el patrón MVT de Django.

      El objetivo fue construir una aplicación funcional de principio a fin,
      incluyendo backend, frontend y despliegue en producción.

      ## Funcionalidades

      - Visualización de catálogo de productos
      - Sistema de autenticación de usuarios
      - Control de acceso a vistas protegidas
      - Panel administrativo con Django Admin

      ## Stack

      - Backend: Django
      - Frontend: HTML, CSS
      - Base de datos: PostgreSQL
      - Deploy: Fly.io

      ## Enlaces
      - 🌐 Demo: https://onlyflans.fly.dev/
      - 📦 Repositorio: https://github.com/EniDev911/onlyflans

  - name: "scriptorium.md"
    language: "md"
    content_file: |
      # SCRIPTORIUM

      Página interactiva para practicar y perfeccionar habilidades en
      HTML, CSS y JavaScript sobre un lienzo minimalista, pensada como
      espacio de aprendizaje y demostración de retos de código web.

      ## Contexto

      SCRIPTORIUM es un proyecto personal enfocado en **retos y
      ejercicios frontend** que permiten dominar conceptos fundamentales
      del desarrollo web mediante ejemplos prácticos y visuales.

      El sitio se diseñó como un “lienzo” minimalista donde se pueden
      explorar diferentes retos de HTML, CSS y JavaScript, ideal para
      reforzar la comprensión de estas tecnologías básicas.

      ## Funcionalidades

      - Conjunto de retos y ejemplos de código web
      - Integración de ejercicios de **HTML, CSS y JS**
      - Interfaz minimalista de navegación por habilidades
      - Incluye enlaces directos a ejercicios clave

      ## Stack

      - Frontend: HTML, CSS, JavaScript, Jekyll
      - Diseño minimalista y centrado en la práctica del código

      ## Enlaces
      - 🌐 Proyecto: https://mcherrera.dev/scriptorium/

  - name: "fullstack-java.md"
    language: "md"
    content_file: |
      # FullStack Java

      Sitio web desarrollado con React como iniciativa personal para
      centralizar y compartir recursos útiles con compañeros del curso
      Full Stack en Generation.

      ## Contexto
      El proyecto surge de la necesidad de organizar apuntes, enlaces
      y material de apoyo en un solo lugar, facilitando el acceso a
      recursos y soluciones de distintos desafíos durante el proceso de aprendizaje.

      ## Funcionalidades
      - Interfaz desarrollada con React
      - Organización de recursos por secciones
      - Navegación simple y clara
      - Enfoque en usabilidad y accesibilidad

      ## Stack
      - Frontend: React
      - Lenguaje: JavaScript
      - Estilos: CSS
      - Deploy: Subdominio propio

      ## Enlaces
      - 🌐 Sitio: https://fullstack-java.mcherrera.dev/

  - name: "fullstack-python.md"
    language: "md"
    content_file: |
      # FullStack Python

      Plataforma web construida con Jekyll para documentar y estructurar
      contenidos técnicos relacionados con Python y desarrollo web,
      utilizada como apoyo durante el bootcamp de Talento Digital.

      ## Contexto
      Durante el desarrollo del bootcamp surgió la necesidad de contar con
      un espacio claro y ordenado donde consultar conceptos, ejemplos
      y referencias técnicas sin depender de múltiples fuentes dispersas.

      Este proyecto se enfocó en transformar apuntes y material de estudio
      en un sitio navegable, fácil de mantener y optimizado.

      ## Enfoque
      - Priorización del contenido por sobre la interfaz
      - Estructura pensada para estudio progresivo
      - Uso de generación estática para simplicidad y rendimiento

      ## Stack
      - Generador estático: Jekyll
      - Contenido: Markdown
      - Frontend: HTML, CSS
      - Deploy: Subdominio propio

      ## Enlaces
      - 🌐 Sitio: https://fullstack-python.mcherrera.dev/

